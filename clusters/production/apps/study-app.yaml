apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: study
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gabehamasaki/infra.git
    targetRevision: main
    path: apps/study
  destination:
    server: https://kubernetes.default.svc
    namespace: study
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
