# RustFS compartilhado (armazenamento S3-compatível). Standalone (1 pod) por
# enquanto - modo "distributed" (erasure coding entre pods) só faz sentido com
# >=2 nodes de verdade, então isso fica pra quando houver workers.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.rustfs.com
    chart: rustfs
    targetRevision: "1.0.0-rc.5"
    helm:
      values: |
        mode:
          standalone:
            enabled: true
          distributed:
            enabled: false
        secret:
          existingSecret: rustfs-credentials
        storageclass:
          name: local-path
          dataStorageSize: 5Gi
          logStorageSize: 256Mi
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        # Ingress/TLS temporariamente desligado: o chart, com tls.enabled=true
        # e tls.certManager.enabled=false, cria seu próprio Secret com conteúdo
        # inválido, conflitando com o que o cert-manager escreve - isso gerou
        # um loop de reemissão que bateu no rate limit do Let's Encrypt (5
        # certs/semana pro mesmo host). Reativar só depois de 2026-09-06 ~16:12
        # UTC, com `ingress.tls.certManager.enabled: true` adicionado.
        ingress:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: rustfs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
