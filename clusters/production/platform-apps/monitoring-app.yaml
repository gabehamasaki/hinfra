apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  labels:
    hinfra.layer: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  # Só os manifests extras. O chart kube-prometheus-stack é instalado pelo Ansible
  # porque a VPS baixa o index.yaml do prometheus-community a ~126 KB/s e o
  # helm do repo-server desiste em 120s — ver docs/13-observabilidade.md.
  source:
    repoURL: https://github.com/gabehamasaki/hinfra.git
    targetRevision: main
    path: platform/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
