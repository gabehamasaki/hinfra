# Copie para clusters/production/apps/ ao provisionar o kit (adotantes).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: valkey
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://valkey.io/valkey-helm/
    chart: valkey
    targetRevision: "0.12.0"
    helm:
      values: |
        auth:
          enabled: true
          usersExistingSecret: valkey-auth
          aclUsers:
            default:
              permissions: "~* &* +@all"
        dataStorage:
          enabled: true
          requestedSize: 512Mi
          className: local-path
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
        replica:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: valkey
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
