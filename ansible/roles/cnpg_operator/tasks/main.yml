---
# CloudNativePG: operador do Postgres (plataforma - instalado via Ansible/Helm).
# O Cluster de fato (instâncias, storage) é gerido pelo ArgoCD em data-services/postgres/.
- name: Adicionar repo Helm do CloudNativePG
  kubernetes.core.helm_repository:
    name: cnpg
    repo_url: https://cloudnative-pg.github.io/charts

- name: Instalar/atualizar o operador do CloudNativePG
  kubernetes.core.helm:
    name: cnpg
    chart_ref: cnpg/cloudnative-pg
    release_namespace: cnpg-system
    create_namespace: true
    wait: true
