---
- name: Adicionar repo Helm do ArgoCD
  kubernetes.core.helm_repository:
    name: argo
    repo_url: https://argoproj.github.io/argo-helm

- name: Renderizar o Middleware (Tailscale-only) e os values do Helm
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../platform/argocd/{{ item.src }}"
    dest: "/tmp/{{ item.dest }}"
    mode: "0600"
  loop:
    - { src: tailnet-only-middleware.yaml.j2, dest: argocd-middleware.yaml }
    - { src: values.yaml.j2, dest: argocd-values.yaml }

- name: Exigir webhook Discord no vault (notificações ArgoCD)
  ansible.builtin.assert:
    that:
      - vault_alertmanager_discord_webhook_url is defined
      - vault_alertmanager_discord_webhook_url | length > 0
    fail_msg: >
      Defina vault_alertmanager_discord_webhook_url em vault.yml (compartilhado com Alertmanager).

- name: Instalar/atualizar ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: true
    values_files:
      - /tmp/argocd-values.yaml
    wait: true
    wait_timeout: 5m0s

- name: Esperar o argocd-server ficar pronto
  kubernetes.core.k8s_info:
    kind: Deployment
    name: argocd-server
    namespace: "{{ argocd_namespace }}"
    wait: true
    wait_condition:
      type: Available
      status: "True"
    wait_timeout: 180

- name: Traefik - externalTrafficPolicy Local (senão o IP de origem real chega mascarado e o IPAllowList do middleware não funciona)
  kubernetes.core.k8s:
    state: patched
    kind: Service
    name: traefik
    namespace: kube-system
    definition:
      spec:
        externalTrafficPolicy: Local

- name: Aplicar o Middleware Tailscale-only (Traefik só libera argocd.{{ infra_domain }} pra tailnet)
  kubernetes.core.k8s:
    state: present
    src: /tmp/argocd-middleware.yaml

- name: Ler a senha admin inicial do ArgoCD
  kubernetes.core.k8s_info:
    kind: Secret
    name: argocd-initial-admin-secret
    namespace: "{{ argocd_namespace }}"
  register: argocd_admin_secret

- name: Mostrar a senha admin inicial (só existe no primeiro install - troque-a e delete o secret)
  ansible.builtin.debug:
    msg: >
      Senha admin inicial do ArgoCD:
      {{ argocd_admin_secret.resources[0].data.password | b64decode }}
      -- troque com `argocd account update-password` e depois rode:
      kubectl -n {{ argocd_namespace }} delete secret argocd-initial-admin-secret
  when: argocd_admin_secret.resources | length > 0

- name: Renderizar Secret do repo Helm prometheus-community
  ansible.builtin.template:
    src: argocd-repo-prometheus-helm.yaml.j2
    dest: /tmp/argocd-repo-prometheus-helm.yaml
    mode: "0600"
  when: hinfra_deploy_platform_root | bool

- name: Registrar repo Helm prometheus-community no ArgoCD
  kubernetes.core.k8s:
    state: present
    src: /tmp/argocd-repo-prometheus-helm.yaml
  when: hinfra_deploy_platform_root | bool

- name: Credencial do ArgoCD pro repo hinfra (plataforma / platform-root)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: hinfra-repo-creds
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: "{{ hinfra_repo_url }}"
        username: "{{ hinfra_repo_username | default('git') }}"
        password: "{{ vault_hinfra_repo_token | default(vault_workloads_repo_token, true) }}"
  when: hinfra_deploy_platform_root | bool
  no_log: true

- name: Credencial do ArgoCD pro repo hinfra-workloads (privado)
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: workloads-repo-creds
        namespace: "{{ argocd_namespace }}"
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: "{{ hinfra_workloads_repo_url }}"
        username: "{{ hinfra_workloads_repo_username | default('git') }}"
        password: "{{ vault_workloads_repo_token }}"
  when: hinfra_deploy_workloads_root | bool

- name: Copiar a Application raiz pública (exemplos para adotantes)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../clusters/production/root-app.yaml"
    dest: /tmp/root-app.yaml
    mode: "0600"
  when: hinfra_deploy_public_gitops_examples | bool

- name: Aplicar a Application raiz pública (App of Apps)
  kubernetes.core.k8s:
    state: present
    src: /tmp/root-app.yaml
  when: hinfra_deploy_public_gitops_examples | bool

- name: Copiar workloads-root (repo privado)
  ansible.builtin.copy:
    src: root-workloads.yaml
    dest: /tmp/root-workloads.yaml
    mode: "0600"
  when: hinfra_deploy_workloads_root | bool

- name: Aplicar workloads-root
  kubernetes.core.k8s:
    state: present
    src: /tmp/root-workloads.yaml
  when: hinfra_deploy_workloads_root | bool

- name: Renderizar platform-root (App of Apps — camada plataforma no repo hinfra)
  ansible.builtin.template:
    src: platform-root.yaml.j2
    dest: /tmp/platform-root.yaml
    mode: "0600"
  when: hinfra_deploy_platform_root | bool

- name: Aplicar platform-root
  kubernetes.core.k8s:
    state: present
    src: /tmp/platform-root.yaml
  when: hinfra_deploy_platform_root | bool

- name: Remover root-app público (evita sincronizar só apps/example do hinfa)
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: root-app
    namespace: "{{ argocd_namespace }}"
  when:
    - hinfra_deploy_workloads_root | bool
    - not (hinfra_deploy_public_gitops_examples | bool)

- name: Remover Application example (template do repo público)
  kubernetes.core.k8s:
    state: absent
    api_version: argoproj.io/v1alpha1
    kind: Application
    name: example
    namespace: "{{ argocd_namespace }}"
  when:
    - hinfra_deploy_workloads_root | bool
    - not (hinfra_deploy_public_gitops_examples | bool)
