---
- name: sqlite3 instalado (necessário pro backup online do datastore)
  ansible.builtin.apt:
    name: sqlite3
    state: present

- name: rclone instalado (envio offsite pro R2)
  ansible.builtin.apt:
    name: rclone
    state: present
  when: k3s_backup_remote_enabled | bool

- name: Diretório de configuração do backup
  ansible.builtin.file:
    path: /etc/k3s-backup
    state: directory
    mode: "0700"
  when: k3s_backup_remote_enabled | bool

- name: Configuração do rclone (credenciais do R2)
  ansible.builtin.template:
    src: rclone.conf.j2
    dest: /etc/k3s-backup/rclone.conf
    mode: "0600"
  when: k3s_backup_remote_enabled | bool
  no_log: true

- name: Script de backup
  ansible.builtin.template:
    src: k3s-backup.sh.j2
    dest: /usr/local/bin/k3s-backup.sh
    mode: "0755"

- name: Variáveis de notificação do backup (Discord / healthcheck)
  ansible.builtin.template:
    src: k3s-backup.env.j2
    dest: /etc/k3s-backup/env
    mode: "0600"
  when: k3s_backup_discord_webhook_enabled | bool or k3s_backup_healthcheck_enabled | bool
  no_log: true

- name: systemd service + timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - k3s-backup.service
    - k3s-backup.timer
  notify: reload systemd e habilitar timer

- name: Rodar handlers agora (garante o timer ativo já nesta execução)
  ansible.builtin.meta: flush_handlers
