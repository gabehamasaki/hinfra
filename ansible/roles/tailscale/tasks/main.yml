---
- name: Instalar Tailscale (script oficial, idempotente)
  ansible.builtin.shell: |
    set -e
    if ! command -v tailscale >/dev/null 2>&1; then
      curl -fsSL https://tailscale.com/install.sh | sh
    fi
  args:
    creates: /usr/bin/tailscale

- name: Habilitar IP forwarding (necessário pro k3s/flannel sobre a tailnet)
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: Checar status atual do Tailscale
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_raw
  changed_when: false
  failed_when: false

- name: Entrar na tailnet (só se ainda não estiver logado)
  ansible.builtin.command: >
    tailscale up
    --reset
    --authkey={{ vault_tailscale_authkey }}
    --hostname={{ tailscale_hostname }}
    --advertise-tags={{ tailscale_tags }}
    --ssh=false
    --snat-subnet-routes=false
  when: >
    tailscale_status_raw.rc != 0
    or (tailscale_status_raw.stdout | from_json).BackendState != "Running"

# Task separada porque o `tailscale up` acima só roda em node novo — num node já na
# tailnet ele é pulado, e a preferência continuaria com o default.
#
# Por que desligar o SNAT: com ele ligado, o tailscaled marca o pacote que entra pela
# tailnet e o `ts-postrouting` o mascara na saída para a rede de pods. O Traefik passa a
# ver o endereço da bridge cni0 (10.42.0.1) como origem, o `IPAllowList` não casa com
# 100.64.0.0/10 e TODOS os consoles respondem 403 — inclusive de dentro da tailnet.
# Não há subnet route anunciada aqui (`--advertise-routes` não é usado), então o SNAT não
# serve a nenhum propósito nesta topologia. Ver docs/11-armadilhas.md.
- name: Desligar o SNAT do Tailscale (senão o IPAllowList dos consoles quebra)
  ansible.builtin.command: tailscale set --snat-subnet-routes=false
  changed_when: false

- name: Obter IP tailscale deste host
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip_result
  changed_when: false

- name: Guardar IP tailscale como fact
  ansible.builtin.set_fact:
    tailscale_ip: "{{ tailscale_ip_result.stdout | trim }}"
