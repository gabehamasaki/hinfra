---
# Variáveis não-sensíveis, compartilhadas por todos os hosts do cluster.

deploy_user: deploy

infra_domain: hamasakis.cloud     # domínio dos serviços de plataforma (argocd, etc)
apps_domain: hamasakis.dev        # domínio dos projetos
# acme_email e r2_account_id ficam em local.yml (não versionado) — ver local.yml.example

hinfra_repo_url: "https://github.com/gabehamasaki/hinfra.git"
hinfra_workloads_repo_url: "https://github.com/gabehamasaki/hinfra-workloads.git"
# Adotantes: true + false. Sua VPS: false + true (só workloads privados).
hinfra_deploy_public_gitops_examples: false
hinfra_deploy_workloads_root: true
# Applications de plataforma (observabilidade, etc.) no repo hinfra — visíveis no ArgoCD.
hinfra_deploy_platform_root: true

k3s_channel: stable

# Tailscale
tailscale_tags: "tag:k8s"          # ajuste as ACLs no admin console do Tailscale pra essa tag
tailscale_hostname: "{{ tailscale_hostname | default(inventory_hostname) }}"

# MTU do flannel sobre a interface tailscale0 (evita fragmentação silenciosa, ver README)
k3s_flannel_iface: tailscale0
k3s_flannel_mtu: 1280

# Ranges da Cloudflare (https://api.cloudflare.com/client/v4/ips). Ficam aqui, e não
# nos defaults de um role, porque dois roles em plays diferentes precisam deles:
# `common` (UFW só aceita 80/443 vindo da Cloudflare) e `traefik` (só confia no
# X-Forwarded-For vindo dela). O role common confere esta lista contra a API e falha
# se divergir — uma mudança da Cloudflare tem que aparecer como erro do playbook,
# não como site fora do ar. Atualizar é um commit deliberado aqui.
cloudflare_ip_ranges_v4:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
cloudflare_ip_ranges_v6:
  - "2400:cb00::/32"
  - "2606:4700::/32"
  - "2803:f800::/32"
  - "2405:b500::/32"
  - "2405:8100::/32"
  - "2a06:98c0::/29"
  - "2c0f:f248::/32"

argocd_namespace: argocd
cert_manager_namespace: cert-manager
sealed_secrets_namespace: kube-system
monitoring_namespace: monitoring

# kube-prometheus-stack (prometheus-community). Versão pinada — não usar "*".
kube_prometheus_stack_chart_version: "70.2.1"

k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
k3s_backup_dir: /var/backups/k3s
k3s_backup_retention_days: 7

# Backup offsite no Cloudflare R2. Ativa sozinho quando as credenciais existem
# no vault - sem elas o backup continua funcionando, só local. Isso mantém o
# repositório utilizável em uma VPS nova antes de haver credencial.
r2_backup_bucket: infra-backups
k3s_backup_remote_name: r2
k3s_backup_remote_retention_days: 30
k3s_backup_remote_enabled: "{{ vault_r2_access_key_id is defined and (vault_r2_access_key_id | length) > 0 }}"

# Notificações de backup (opcional). Usa o mesmo webhook do Discord por padrão.
k3s_backup_discord_webhook_enabled: "{{ vault_alertmanager_discord_webhook_url is defined and (vault_alertmanager_discord_webhook_url | length) > 0 }}"
k3s_backup_healthcheck_enabled: "{{ vault_k3s_backup_healthcheck_url is defined and (vault_k3s_backup_healthcheck_url | length) > 0 }}"
