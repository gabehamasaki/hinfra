apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
    # Rate limit por cliente. Só faz sentido em Ingress que recebe tráfego pela
    # Cloudflare: o middleware identifica o cliente pelo header CF-Connecting-IP.
    traefik.ingress.kubernetes.io/router.middlewares: "kube-system-public-rate-limit@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - example.CHANGE-ME.apps.domain
      secretName: example-tls
  rules:
    - host: example.CHANGE-ME.apps.domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: example
                port:
                  number: 80
