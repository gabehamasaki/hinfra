# Template monorepo (api + web) — copie para `.github/workflows/deploy.yml` no repo do projeto.
# Ajuste IMAGE_API, IMAGE_WEB e APP_PATH. Requer INFRA_REPO_TOKEN (PAT fine-grained no repo infra).
# Paths de build vêm de hinfra.yml (buildContexts); defaults ./api e ./web.
# IMPORTANTE: o campo `file` do docker/build-push-action é relativo à RAIZ do repo, não ao `context`.
name: deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  APP_PATH: apps/CHANGE-ME
  IMAGE_API: gabehamasaki/CHANGE-ME-api
  IMAGE_WEB: gabehamasaki/CHANGE-ME-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da api
        uses: docker/build-push-action@v6
        with:
          context: BUILD_CONTEXT_API
          file: BUILD_FILE_API
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest

      - name: Build e push do web
        uses: docker/build-push-action@v6
        with:
          context: BUILD_CONTEXT_WEB
          file: BUILD_FILE_WEB
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:latest

      - name: Checkout do repo infra
        uses: actions/checkout@v4
        with:
          repository: gabehamasaki/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Instalar kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Atualizar tags no repo infra
        working-directory: infra/${{ env.APP_PATH }}
        run: |
          kustomize edit set image ${{ env.REGISTRY }}/${{ env.IMAGE_API }}=${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}
          kustomize edit set image ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}=${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ github.sha }}

      - name: Commit e push no repo infra
        working-directory: infra
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.APP_PATH }}/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy: ${{ env.IMAGE_API }}+${{ env.IMAGE_WEB }}@${{ github.sha }}"
          git push
