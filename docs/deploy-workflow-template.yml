# Template de referência - copie para `.github/workflows/deploy.yml` no repo do projeto.
# Deploy apenas no push de tag (commit na branch do ambiente; default main). Prefixos: v*, dev/**, hg/**.
# Requer HINFRA_WORKLOADS_TOKEN (PAT fine-grained no repo hinfra-workloads, Contents Read/Write).
name: deploy

on:
  push:
    tags:
TAG_TRIGGER_YAML

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gabehamasaki/CHANGE-ME
  APP_PATH: apps/CHANGE-ME

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar tag e ambiente
        id: meta
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            dev/*) deploy_env=dev; kust_subpath="/overlays/dev" ;;
            hg/*) deploy_env=homolog; kust_subpath="/overlays/homolog" ;;
            v*) deploy_env=production; kust_subpath="" ;;
            *)
              echo "tag não suportada: $ref (use v*, dev/* ou hg/*)"
              exit 1
              ;;
          esac
          deploy_branch=main
          case "$ref" in
DEPLOY_BRANCH_MAP
          esac
          git fetch origin "$deploy_branch" --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$deploy_branch"
          image_tag="${ref//\//-}"
          if [ "$deploy_env" = "production" ]; then
            kust_path="${{ env.APP_PATH }}"
          else
            kust_path="${{ env.APP_PATH }}${kust_subpath}"
          fi
          echo "deploy_env=$deploy_env" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "kust_path=$kust_path" >> "$GITHUB_OUTPUT"
          echo "git_tag=$ref" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}

      - name: Checkout do repo hinfra-workloads
        uses: actions/checkout@v4
        with:
          repository: gabehamasaki/hinfra-workloads
          token: ${{ secrets.HINFRA_WORKLOADS_TOKEN }}
          path: workloads

      - name: Verificar overlay do ambiente
        run: |
          set -euo pipefail
          kust="workloads/${{ steps.meta.outputs.kust_path }}/kustomization.yaml"
          if [ ! -f "$kust" ]; then
            echo "ambiente ${{ steps.meta.outputs.deploy_env }} não provisionado no workloads ($kust ausente)"
            exit 1
          fi

      - name: Instalar kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Atualizar a tag da imagem no repo workloads
        working-directory: workloads/${{ steps.meta.outputs.kust_path }}
        run: |
          kustomize edit set image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}

      - name: Commit e push no repo workloads
        working-directory: workloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ steps.meta.outputs.kust_path }}/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "deploy(${{ steps.meta.outputs.deploy_env }}): ${{ env.IMAGE_NAME }}@${{ steps.meta.outputs.git_tag }}"
          git push
